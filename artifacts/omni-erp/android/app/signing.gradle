// Release signing for ZorvanI ERP — applied from android/app/build.gradle by
// mobile/setup-android.ps1. No secret lives in the repository: everything is
// read from environment variables at build time.
//
//   ZORVANI_KEYSTORE_PATH       absolute path to the .jks / .keystore file
//   ZORVANI_KEYSTORE_PASSWORD   keystore password
//   ZORVANI_KEY_ALIAS           key alias inside the keystore
//   ZORVANI_KEY_PASSWORD        key password
//
// When the variables are not set the release build still runs but produces an
// UNSIGNED bundle, which Google Play will not accept.

def zorvaniKeystorePath = System.getenv('ZORVANI_KEYSTORE_PATH')
def zorvaniSigningReady = zorvaniKeystorePath &&
    System.getenv('ZORVANI_KEYSTORE_PASSWORD') &&
    System.getenv('ZORVANI_KEY_ALIAS') &&
    System.getenv('ZORVANI_KEY_PASSWORD')

if (zorvaniSigningReady) {
    android {
        signingConfigs {
            zorvaniRelease {
                storeFile file(zorvaniKeystorePath)
                storePassword System.getenv('ZORVANI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ZORVANI_KEY_ALIAS')
                keyPassword System.getenv('ZORVANI_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.zorvaniRelease
            }
        }
    }
} else {
    logger.lifecycle('ZorvanI ERP: release signing variables are not set - release artifacts will be unsigned.')
}
