kind = "web"
previewPath = "/"
title = "OmniERP / BizOS"
version = "1.0.0"
id = "artifacts/omni-erp"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20679

[services.development]
run = "pnpm --filter @workspace/omni-erp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/omni-erp", "run", "build" ]
serve = "static"
publicDir = "artifacts/omni-erp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20679"
BASE_PATH = "/"
